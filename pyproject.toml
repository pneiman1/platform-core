[project]
name = "platform-core"
version = "0.1.0"
description = "Shared infrastructure for vertical analytics products"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Phil Neiman" }]
keywords = ["analytics", "saas", "dbt", "snowflake", "rag"]

dependencies = [
    # Configuration
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",

    # Logging
    "structlog>=24.1",

    # Data warehouse
    "snowflake-connector-python>=3.7",
    "snowflake-sqlalchemy>=1.5",
    "sqlalchemy>=2.0",
    # Direct import: warehouse.connection loads the keypair-auth private key.
    # Also a snowflake-connector-python dep, but we import it ourselves.
    "cryptography>=42.0",

    # Application database
    "psycopg2-binary>=2.9",
    "pgvector>=0.2.5",

    # Data manipulation
    "pandas>=2.2",
    "pyarrow>=15.0",
]

[project.optional-dependencies]

# API server dependencies
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
]

# Machine learning dependencies
ml = [
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "umap-learn>=0.5",
]

# Forecasting dependencies (Prophet has heavy install, so it is opt-in)
forecasting = [
    "prophet>=1.1",
]

# LLM dependencies for the RAG pipeline
llm = [
    "anthropic>=0.40",
    "tiktoken>=0.6",
]

# Voyage embeddings (paid, higher quality)
voyage = [
    "voyageai>=0.2",
]

# Local sentence-transformers embeddings (free, lower quality but fine for dev)
sentence-transformers = [
    "sentence-transformers>=2.7",
]

# Development and testing tools
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "black>=24.2",
    "mypy>=1.9",
    "faker>=24.0",
]

# Convenience: everything for local dev
all = [
    "platform-core[api,ml,forecasting,llm,sentence-transformers,dev]",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["platform_core*"]
exclude = ["tests*", ".venv*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
